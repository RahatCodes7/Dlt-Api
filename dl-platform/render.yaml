services:
  - type: web
    name: dlt-api-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: "600"
      - key: INFO_TIMEOUT_SECONDS
        value: "120"
      - key: GUNICORN_TIMEOUT
        value: "1200"
